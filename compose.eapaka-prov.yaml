# 本PoC（eapaka-radius-server-poc）と同じホストで動かすときに重ねる設定。
# 本PoCの compose が作る共有ネットワーク（既定の名前は eapaka-prov）に BFF だけを参加させ、
# ホスト名 provisioning-api で Provisioning API に接続する。BFF 専用の Valkey は参加させない。
# 共有ネットワークは本PoCを docker compose --profile provisioning up -d したときだけ作られるので、本PoCを先に起動する。
# .env の COMPOSE_FILE=compose.yaml:compose.eapaka-prov.yaml で有効になる。
services:
  eapaka-webgui:
    networks:
      - default
      - eapaka-prov

networks:
  eapaka-prov:
    external: true
    name: ${PROVISIONING_SHARED_NETWORK:-eapaka-prov}

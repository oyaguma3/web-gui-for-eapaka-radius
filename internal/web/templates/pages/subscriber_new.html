{{define "content" -}}
<nav aria-label="breadcrumb"><ul><li><a href="/subscribers">加入者</a></li><li>登録</li></ul></nav>
<h1>加入者の登録</h1>
{{with .Data -}}
{{if .Error}}<p class="notice-error" role="alert">{{.Error}}</p>{{end}}
<form method="post" action="/subscribers" autocomplete="off">
  <label>
    IMSI
    <input name="imsi" value="{{.IMSI}}" required inputmode="numeric" pattern="[0-9]{15}" maxlength="15"{{if .Errors.imsi}} aria-invalid="true"{{end}}>
    <small>{{or .Errors.imsi "15 桁の数字"}}</small>
  </label>
  <div class="grid">
    <label>
      Ki
      <input name="ki" value="{{.Ki}}" required pattern="[0-9A-Fa-f]{32}" maxlength="32" spellcheck="false" class="mono"{{if .Errors.ki}} aria-invalid="true"{{end}}>
      <small>{{or .Errors.ki "16 進 32 桁"}}</small>
    </label>
    <label>
      OPc
      <input name="opc" value="{{.OPc}}" required pattern="[0-9A-Fa-f]{32}" maxlength="32" spellcheck="false" class="mono"{{if .Errors.opc}} aria-invalid="true"{{end}}>
      <small>{{or .Errors.opc "16 進 32 桁"}}</small>
    </label>
  </div>
  <div class="grid">
    <label>
      AMF
      <input name="amf" value="{{.AMF}}" required pattern="[0-9A-Fa-f]{4}" maxlength="4" spellcheck="false" class="mono"{{if .Errors.amf}} aria-invalid="true"{{end}}>
      <small>{{or .Errors.amf "16 進 4 桁（既定 8000）"}}</small>
    </label>
    <label>
      SQN
      <input name="sqn" value="{{.SQN}}" required pattern="[0-9A-Fa-f]{12}" maxlength="12" spellcheck="false" class="mono"{{if .Errors.sqn}} aria-invalid="true"{{end}}>
      <small>{{or .Errors.sqn "16 進 12 桁（既定 000000000000）"}}</small>
    </label>
  </div>
  <p><small>登録した後は、Ki と OPc は管理者だけが表示・変更できます。認可ポリシーは加入者とは別に設定します。</small></p>
  <button type="submit">登録する</button>
  <a href="/subscribers" role="button" class="secondary outline">やめる</a>
</form>
{{- end}}
{{- end}}

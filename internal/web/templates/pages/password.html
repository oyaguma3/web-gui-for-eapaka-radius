{{define "content" -}}
<article class="narrow">
  <header><strong>パスワード変更</strong></header>
  {{with .Data -}}
  {{if .Done}}<p class="notice-ok" role="status">パスワードを変更しました。他の端末のログインは無効になりました。</p>{{end}}
  {{if .Required}}<p class="notice-warn" role="alert">管理者が設定したパスワードでログインしています。続けるには、パスワードを変更してください。</p>{{end}}
  {{if .Error}}<p class="notice-error" role="alert">{{.Error}}</p>{{end}}
  <form method="post" action="/password">
    <label>
      現在のパスワード
      <input type="password" name="current" autocomplete="current-password" required>
    </label>
    <label>
      新しいパスワード
      <input type="password" name="password" autocomplete="new-password" required minlength="{{minPasswordLen}}">
      <small>{{minPasswordLen}} 文字以上。ユーザーID と同じものは使えません。</small>
    </label>
    <label>
      新しいパスワード（確認）
      <input type="password" name="confirm" autocomplete="new-password" required minlength="{{minPasswordLen}}">
    </label>
    <button type="submit">変更する</button>
  </form>
  {{- end}}
</article>
{{- end}}

{{define "content" -}}
<article>
  <header><strong>{{.Data.Status}} {{.Title}}</strong></header>
  <p>{{.Data.Message}}{{template "op-link" .Data.OperationID}}</p>
  <footer>{{if .Data.Link}}<a href="{{.Data.Link}}">{{.Data.LinkLabel}}</a>{{else}}<a href="/">ホームへ戻る</a>{{end}}</footer>
</article>
{{- end}}

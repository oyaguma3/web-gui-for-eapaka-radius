# テスト、イメージのビルドと compose の設定の確認、本PoCの Provisioning API との契約テスト、
# eapaka-node-provisioner との契約テストを行う。
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# 同じブランチで新しく push したら、古い実行は止める。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: テスト
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # internal/store の結合テストに使う。論理データベース 1 番を空にして使う。
      valkey:
        image: valkey/valkey:9
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: 整形の確認
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt で整形されていないファイル:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: テスト（Valkey の結合テストを含む）
        env:
          EAPAKA_WEBGUI_TEST_VALKEY_ADDR: localhost:6379
        run: go test -race -count=1 ./...
      - name: Valkey の結合テストが実行されたことの確認
        env:
          EAPAKA_WEBGUI_TEST_VALKEY_ADDR: localhost:6379
        run: |
          set -o pipefail
          # 接続先がなければ結合テストはスキップされ、テスト自体は成功してしまうので、別に確かめる。
          go test -count=1 -v ./internal/store/ | tee store.log
          if grep -q -- '--- SKIP' store.log; then
            echo "Valkey の結合テストがスキップされました"
            exit 1
          fi

  docker:
    name: イメージと compose の設定
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: イメージのビルド
        run: docker build --build-arg VERSION="${GITHUB_SHA::7}" -t eapaka-webgui:ci .
      - name: compose の設定（同一ホストと別ホスト）
        run: |
          cp .env.example .env
          sed -i -e 's|^EAPAKA_WEBGUI_VALKEY_PASSWORD=.*|EAPAKA_WEBGUI_VALKEY_PASSWORD=ci|' \
            -e 's|^EAPAKA_WEBGUI_INITIAL_ADMIN_PASSWORD=.*|EAPAKA_WEBGUI_INITIAL_ADMIN_PASSWORD=ci-password|' .env
          docker compose config -q
          docker compose config --services
          COMPOSE_FILE=compose.yaml docker compose config -q

  contract:
    name: Provisioning API との契約テスト
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 契約テストの相手にする本PoC（eapaka-radius-server-poc）のコミット。
      # 本PoCの Provisioning API を変えたら、その main のコミットに更新する。
      POC_REF: def95e59143c27ca011b81e3ed90f8edcc0762a6
    services:
      # provisioning-api が使う Valkey（このジョブ専用で、テストデータは最後に消える）。
      valkey:
        image: valkey/valkey:9
        ports:
          - 16379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: oyaguma3/eapaka-radius-server-poc
          ref: ${{ env.POC_REF }}
          path: eapaka-radius-server-poc
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: provisioning-api と eapaka-webgui のビルド
        run: |
          git -C eapaka-radius-server-poc log -1 --format='本PoC: %h %s'
          (cd eapaka-radius-server-poc/apps/provisioning-api && go build -o "$RUNNER_TEMP/provisioning-api" .)
          go build -o "$RUNNER_TEMP/eapaka-webgui" ./cmd/eapaka-webgui
      - name: 証明書の作成と provisioning-api の起動
        working-directory: ${{ runner.temp }}
        run: |
          # サーバー証明書は本PoCの B-02 §15.2 と同じ手順で作る。
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
            -keyout server.key -out server.pem -days 825 -subj "/CN=provisioning-api" \
            -addext "subjectAltName=DNS:provisioning-api,DNS:localhost,IP:127.0.0.1"
          # BFF のクライアント証明書を作り、表示された値で provisioning-api に登録する。
          ./eapaka-webgui gen-client-cert -name bff-ci > bff.pem 2> gen.txt
          cat gen.txt
          clients=$(sed -n 's/^PROVISIONING_API_ADMIN_CLIENTS=//p' gen.txt)
          PROVISIONING_API_LISTEN_ADDR=127.0.0.1:19444 \
          PROVISIONING_API_TLS_CERT=server.pem PROVISIONING_API_TLS_KEY=server.key \
          PROVISIONING_API_ADMIN_CLIENTS="$clients" PROVISIONING_API_NODE_NAME=ci-node \
          REDIS_HOST=127.0.0.1 REDIS_PORT=16379 LOG_LEVEL=INFO \
            nohup ./provisioning-api > provisioning-api.log 2>&1 &
      - name: Provisioning API に接続できるまで待つ
        env:
          EAPAKA_WEBGUI_ADMIN_URL: https://127.0.0.1:19444/admin/v1
          EAPAKA_WEBGUI_ADMIN_CLIENT_CERT: ${{ runner.temp }}/bff.pem
          EAPAKA_WEBGUI_ADMIN_SERVER_CERT: ${{ runner.temp }}/server.pem
        run: |
          for i in $(seq 1 30); do
            "$RUNNER_TEMP/eapaka-webgui" check-admin && exit 0
            sleep 1
          done
          exit 1
      - name: 契約テスト
        env:
          EAPAKA_WEBGUI_TEST_ADMIN_URL: https://127.0.0.1:19444/admin/v1
          EAPAKA_WEBGUI_TEST_ADMIN_CLIENT_CERT: ${{ runner.temp }}/bff.pem
          EAPAKA_WEBGUI_TEST_ADMIN_SERVER_CERT: ${{ runner.temp }}/server.pem
          EAPAKA_WEBGUI_TEST_ADMIN_LOG: ${{ runner.temp }}/provisioning-api.log
        run: |
          set -o pipefail
          go test -count=1 -race -run Integration -v ./internal/provapi/ | tee contract.log
          # 接続先の指定が漏れると契約テストはスキップされ、テスト自体は成功してしまうので、別に確かめる。
          if grep -q -- '--- SKIP' contract.log; then
            echo "契約テストがスキップされました"
            exit 1
          fi
      - name: provisioning-api のログ（失敗時）
        if: failure()
        run: cat "$RUNNER_TEMP/provisioning-api.log"

  provisioner:
    name: eapaka-node-provisioner との契約テスト
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 契約テストの相手にする eapaka-node-provisioner と、その下流（本PoC、aka-only-server）のコミット。
      # provisioner の API を変えたら、その main のコミットに更新する（下流は provisioner の ci.yml の POC_REF / AKA_REF に合わせる）。
      PROVISIONER_REF: 5d7ba4bddfee5410739a8b60b990fe9d146dafd7
      POC_REF: def95e59143c27ca011b81e3ed90f8edcc0762a6
      AKA_REF: 2a6dcf84c82313e5e1b67035ad17083c2ec868c2
    services:
      # provisioning-api、aka-only-server、provisioner がそれぞれ使う Valkey（このジョブ専用）。
      valkey-prov:
        image: valkey/valkey:9
        ports:
          - 16401:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      valkey-aka:
        image: valkey/valkey:9
        ports:
          - 16402:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      valkey-provisioner:
        image: valkey/valkey:9
        ports:
          - 16403:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: oyaguma3/eapaka-node-provisioner
          ref: ${{ env.PROVISIONER_REF }}
          path: eapaka-node-provisioner
      - uses: actions/checkout@v7
        with:
          repository: oyaguma3/eapaka-radius-server-poc
          ref: ${{ env.POC_REF }}
          path: eapaka-radius-server-poc
      - uses: actions/checkout@v7
        with:
          repository: oyaguma3/aka-only-server
          ref: ${{ env.AKA_REF }}
          path: aka-only-server
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: provisioner・下流・eapaka-webgui のビルド
        run: |
          git -C eapaka-node-provisioner log -1 --format='eapaka-node-provisioner: %h %s'
          git -C eapaka-radius-server-poc log -1 --format='本PoC: %h %s'
          git -C aka-only-server log -1 --format='aka-only-server: %h %s'
          (cd eapaka-node-provisioner && go build -o "$RUNNER_TEMP/eapaka-provisioner" ./cmd/eapaka-provisioner)
          (cd eapaka-radius-server-poc/apps/provisioning-api && go build -o "$RUNNER_TEMP/provisioning-api" .)
          (cd aka-only-server && go build -o "$RUNNER_TEMP/aka-only-server" ./cmd/aka-only-server)
          go build -o "$RUNNER_TEMP/eapaka-webgui" ./cmd/eapaka-webgui
      - name: 証明書の作成と起動
        working-directory: ${{ runner.temp }}
        run: |
          # provisioner のクライアント証明書を作り、表示された値で下流 2 つに登録する（provisioner の運用ガイド 2 章と同じ流れ）。
          ./eapaka-provisioner gen-client-cert -name provisioner-ci > pclient.pem 2> pgen.txt
          prov_clients=$(sed -n 's/^PROVISIONING_API_ADMIN_CLIENTS=//p' pgen.txt)
          aka_clients=$(sed -n 's/^AKA_ADMIN_CLIENTS=//p' pgen.txt)

          # provisioning-api。サーバー証明書は本PoCの B-02 §15.2 と同じ手順で作る。
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
            -keyout prov-server.key -out prov-server.pem -days 825 -subj "/CN=provisioning-api" \
            -addext "subjectAltName=DNS:provisioning-api,DNS:localhost,IP:127.0.0.1"
          PROVISIONING_API_LISTEN_ADDR=127.0.0.1:19444 \
          PROVISIONING_API_TLS_CERT=prov-server.pem PROVISIONING_API_TLS_KEY=prov-server.key \
          PROVISIONING_API_ADMIN_CLIENTS="$prov_clients" PROVISIONING_API_NODE_NAME=ci-node \
          REDIS_HOST=127.0.0.1 REDIS_PORT=16401 LOG_LEVEL=INFO \
            nohup ./provisioning-api > provisioning-api.log 2>&1 &

          # aka-only-server。vector-gateway の AVクライアント（ID 1）を登録しておく。
          export AKA_VALKEY_ADDR=127.0.0.1:16402
          ./aka-only-server client gen-cert -name vector-gateway > vector-gateway.pem
          ./aka-only-server client add -name vector-gateway -cert vector-gateway.pem
          AKA_ADMIN_ADDR=127.0.0.1:19443 AKA_AV_TLS_ADDR=127.0.0.1:18443 \
          AKA_ADMIN_TLS_HOSTS=localhost,127.0.0.1 AKA_AV_TLS_HOSTS=localhost,127.0.0.1 \
          AKA_ADMIN_CLIENTS="$aka_clients" \
            nohup ./aka-only-server > aka-only-server.log 2>&1 &
          for i in $(seq 1 30); do
            ./aka-only-server admin-cert > aka-server.pem 2>/dev/null && grep -q 'BEGIN CERTIFICATE' aka-server.pem && break
            sleep 1
          done
          grep -q 'BEGIN CERTIFICATE' aka-server.pem
          unset AKA_VALKEY_ADDR

          # BFF のクライアント証明書を作り、表示された値で provisioner に登録する。
          ./eapaka-webgui gen-client-cert -name bff-ci > bff.pem 2> bgen.txt
          cat bgen.txt

          # provisioner。PLMN 00102 を aka-only-server に置く（契約テストは 00102 の加入者で aka-only-server の側を確かめる）。
          export PROVISIONER_ADDR=127.0.0.1:19446 \
            PROVISIONER_TLS_CERT="$PWD/pv-tls-cert.pem" PROVISIONER_TLS_KEY="$PWD/pv-tls-key.pem" PROVISIONER_TLS_HOSTS=localhost,127.0.0.1 \
            PROVISIONER_ADMIN_CLIENTS="$(sed -n 's/^PROVISIONER_ADMIN_CLIENTS=//p' bgen.txt)" \
            PROVISIONER_CLIENT_CERT="$PWD/pclient.pem" \
            PROVISIONER_PROV_URL=https://127.0.0.1:19444/admin/v1 PROVISIONER_PROV_SERVER_CERT="$PWD/prov-server.pem" \
            PROVISIONER_AKA_URL=https://127.0.0.1:19443/admin/v1 PROVISIONER_AKA_SERVER_CERT="$PWD/aka-server.pem" \
            PROVISIONER_AKA_AV_CLIENT_ID=1 PROVISIONER_PLMN_MAP=00102:01 PROVISIONER_VALKEY_ADDR=127.0.0.1:16403
          ./eapaka-provisioner server-cert > pv-server.pem
          nohup ./eapaka-provisioner serve > provisioner.log 2>&1 &
      - name: provisioner に接続できるまで待つ
        env:
          EAPAKA_WEBGUI_ADMIN_API: provisioner
          EAPAKA_WEBGUI_ADMIN_URL: https://127.0.0.1:19446/admin/v1
          EAPAKA_WEBGUI_ADMIN_CLIENT_CERT: ${{ runner.temp }}/bff.pem
          EAPAKA_WEBGUI_ADMIN_SERVER_CERT: ${{ runner.temp }}/pv-server.pem
        run: |
          for i in $(seq 1 30); do
            "$RUNNER_TEMP/eapaka-webgui" check-admin && exit 0
            sleep 1
          done
          exit 1
      - name: 契約テスト
        env:
          EAPAKA_WEBGUI_TEST_PROVISIONER_URL: https://127.0.0.1:19446/admin/v1
          EAPAKA_WEBGUI_TEST_PROVISIONER_CLIENT_CERT: ${{ runner.temp }}/bff.pem
          EAPAKA_WEBGUI_TEST_PROVISIONER_SERVER_CERT: ${{ runner.temp }}/pv-server.pem
        run: |
          set -o pipefail
          go test -count=1 -race -run Integration -v ./internal/pvapi/ | tee contract.log
          # 接続先の指定が漏れると契約テストはスキップされ、テスト自体は成功してしまうので、別に確かめる。
          if grep -q -- '--- SKIP' contract.log; then
            echo "契約テストがスキップされました"
            exit 1
          fi
      - name: ログ（失敗時）
        if: failure()
        run: |
          echo "---- provisioner ----"; cat "$RUNNER_TEMP/provisioner.log"
          echo "---- provisioning-api ----"; cat "$RUNNER_TEMP/provisioning-api.log"
          echo "---- aka-only-server ----"; cat "$RUNNER_TEMP/aka-only-server.log"
